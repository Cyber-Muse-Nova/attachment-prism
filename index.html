<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="十六道题的依恋风格自测：焦虑 × 回避二维图">
<title>依恋棱镜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Noto+Sans+SC:wght@400;500&family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: one narrow glass column floating over a drifting prism-light field; the question card comes first, the attachment map is revealed on finish */
:root{
  --void:#0c0a17;
  --ink:#eee9ff;
  --mist:#a9a2ca;
  --faint:#6f6890;
  --lilac:#c6a6ff;
  --rose:#ff9ccf;
  --cyan:#86e6ff;
  --glass:rgba(236,228,255,.055);
  --glass-hi:rgba(236,228,255,.11);
  --edge:rgba(214,200,255,.20);
  --edge-soft:rgba(214,200,255,.10);
  --f-display:"ZCOOL XiaoWei","Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-latin:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
html{background:var(--void)}
body{
  background:var(--void);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.75;
  min-height:100vh;padding-inline:16px;padding-block:44px 64px;overflow-x:hidden;
}
*{box-sizing:border-box}

/* drifting prism light */
.field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42;animation:drift 26s ease-in-out infinite alternate}
.orb.a{width:360px;height:360px;background:var(--lilac);top:-120px;left:-110px}
.orb.b{width:300px;height:300px;background:var(--rose);top:38%;right:-140px;animation-duration:31s;opacity:.30}
.orb.c{width:340px;height:340px;background:var(--cyan);bottom:-160px;left:12%;animation-duration:36s;opacity:.26}
.veins{position:absolute;inset:0;opacity:.5;
  background:
    repeating-linear-gradient(115deg,transparent 0 46px,var(--edge-soft) 46px 47px),
    repeating-linear-gradient(25deg,transparent 0 90px,var(--edge-soft) 90px 91px);
  -webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 0%,transparent 70%);
          mask-image:radial-gradient(ellipse at 50% 20%,#000 0%,transparent 70%);
}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.15)}}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;display:grid;gap:28px}

/* header */
.eyebrow{font-family:var(--f-latin);font-style:italic;font-size:17px;letter-spacing:.08em;color:var(--cyan)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,12vw,64px);line-height:1.05;margin:4px 0 10px;
  background:linear-gradient(100deg,var(--lilac) 0%,var(--rose) 48%,var(--cyan) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.lede{color:var(--mist);margin:0;max-width:34em}

/* glass card */
.card{
  background:var(--glass);border:1px solid var(--edge);border-radius:22px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  padding:24px 20px 20px;
  box-shadow:inset 0 1px 0 var(--glass-hi),0 24px 70px -36px var(--lilac);
}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px;color:var(--mist);letter-spacing:.04em}
.meta .num{font-variant-numeric:tabular-nums}
.track{height:2px;background:var(--edge-soft);border-radius:2px;margin:10px 0 22px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--lilac),var(--rose));transition:width .4s ease}

.q{font-family:var(--f-display);font-size:23px;line-height:1.55;margin:0 0 26px;min-height:4.7em;text-wrap:balance;transition:opacity .22s ease,transform .22s ease}
.q.swap{opacity:0;transform:translateY(6px)}

.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.facet{
  appearance:none;background:none;border:0;padding:0;cursor:pointer;
  height:48px;display:grid;place-items:center;border-radius:10px;color:var(--ink);
}
.facet:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
.gem{
  width:calc(var(--s) * 1px);height:calc(var(--s) * 1px);transform:rotate(45deg);
  border:1px solid var(--edge);background:var(--glass);border-radius:3px;
  transition:background .2s,border-color .2s,box-shadow .2s,transform .2s;
}
.facet:hover .gem{border-color:var(--c);transform:rotate(45deg) scale(1.08)}
.facet[aria-pressed="true"] .gem{background:var(--c);border-color:var(--c);box-shadow:0 0 18px var(--c),0 0 4px var(--c)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mist);margin-top:6px}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.ghost{
  appearance:none;background:none;border:1px solid var(--edge);color:var(--mist);
  font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;
}
.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--lilac)}
.ghost:disabled{opacity:.35;cursor:default}
.ghost:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
.hint{font-size:12px;color:var(--faint)}

/* result */
.result{display:grid;gap:22px}
.result .eyebrow{font-size:15px}
.type{font-family:var(--f-display);font-size:clamp(34px,9vw,46px);line-height:1.15;margin:2px 0 0;
  background:linear-gradient(100deg,var(--lilac),var(--rose) 55%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.coords{color:var(--mist);font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.03em}

.map-wrap{max-width:360px;width:100%;margin:0 auto}
.map{width:100%;height:auto;display:block}
.map .frame{fill:none;stroke:var(--edge)}
.map .mid{stroke:var(--edge);stroke-dasharray:3 4}
.map .quad{fill:var(--glass)}
.map .quad.on{fill:var(--glass-hi)}
.map .qlabel{fill:var(--faint);font-family:var(--f-body);font-size:11px}
.map .qlabel.on{fill:var(--ink)}
.map .axis{fill:var(--mist);font-family:var(--f-body);font-size:11px}
.map .tick{fill:var(--faint);font-family:var(--f-body);font-size:9.5px}
.pin{transition:transform .9s cubic-bezier(.2,.8,.2,1)}

.dims{display:grid;gap:16px}
.dim-top{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.dim-top b{font-weight:500}
.dim-top span{color:var(--mist);font-variant-numeric:tabular-nums}
.dim-note{font-size:12px;color:var(--faint);margin-top:2px}
.bar{position:relative;height:6px;border-radius:6px;background:var(--edge-soft);margin-top:8px}
.bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--edge)}
.bar i{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;transform:rotate(45deg);border-radius:2px;
  background:var(--c);box-shadow:0 0 12px var(--c);transition:left .9s cubic-bezier(.2,.8,.2,1);left:50%}

.read p{margin:0 0 12px;max-width:36em}
.read p:last-child{margin-bottom:0}
.read .watch{color:var(--mist)}
.read .edge-note{color:var(--cyan);font-size:13.5px}

.actions{display:flex;flex-wrap:wrap;gap:10px}

.foot{font-size:12px;color:var(--faint);line-height:1.7;max-width:38em}

@media (prefers-reduced-motion:reduce){
  .orb{animation:none}
  .q,.fill,.pin,.bar i,.gem{transition:none}
}
</style>
</head>
<body>
<div class="field" aria-hidden="true">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="veins"></div>
</div>

<main>
  <header>
    <div class="eyebrow">Attachment · Prism</div>
    <h1>依恋棱镜</h1>
    <p class="lede">十六道题，看你在亲密关系里的光怎么折射。凭第一反应选，想着你在意的人作答，不一定是恋人。</p>
  </header>

  <section class="card" id="quiz" aria-label="测试题">
    <div class="meta">
      <span class="num" id="counter">第 1 题 / 共 16 题</span>
      <span>焦虑 × 回避</span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <p class="q" id="qtext" aria-live="polite"></p>
    <div class="scale" id="scale" role="group" aria-label="这句话有多像你，1 到 7"></div>
    <div class="ends"><span>完全不像我</span><span>非常像我</span></div>
    <div class="nav">
      <button class="ghost" id="back" type="button">上一题</button>
      <span class="hint">键盘 1 至 7 也能作答</span>
    </div>
  </section>

  <section class="card result" id="result" hidden aria-label="测试结果">
    <div>
      <div class="eyebrow">Your Refraction</div>
      <h2 class="type" id="typeName">安全型</h2>
      <div class="coords" id="coords"></div>
    </div>

    <div class="map-wrap">
      <svg class="map" viewBox="0 0 300 300" role="img" aria-label="依恋二维图：横轴回避，纵轴焦虑">
        <defs>
          <linearGradient id="gemGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#86e6ff"/>
            <stop offset=".5" stop-color="#c6a6ff"/>
            <stop offset="1" stop-color="#ff9ccf"/>
          </linearGradient>
          <radialGradient id="halo">
            <stop offset="0" stop-color="#ff9ccf" stop-opacity=".55"/>
            <stop offset="1" stop-color="#ff9ccf" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect class="quad" data-q="anxious"  x="40"  y="20"  width="120" height="120"/>
        <rect class="quad" data-q="fearful"  x="160" y="20"  width="120" height="120"/>
        <rect class="quad" data-q="secure"   x="40"  y="140" width="120" height="120"/>
        <rect class="quad" data-q="avoidant" x="160" y="140" width="120" height="120"/>
        <rect class="frame" x="40" y="20" width="240" height="240" rx="2"/>
        <line class="mid" x1="160" y1="20" x2="160" y2="260"/>
        <line class="mid" x1="40" y1="140" x2="280" y2="140"/>
        <text class="qlabel" data-q="anxious"  x="48"  y="36">焦虑型</text>
        <text class="qlabel" data-q="fearful"  x="272" y="36" text-anchor="end">恐惧-回避型</text>
        <text class="qlabel" data-q="secure"   x="48"  y="252">安全型</text>
        <text class="qlabel" data-q="avoidant" x="272" y="252" text-anchor="end">回避型</text>
        <text class="tick" x="40"  y="274" text-anchor="middle">1</text>
        <text class="tick" x="160" y="274" text-anchor="middle">4</text>
        <text class="tick" x="280" y="274" text-anchor="middle">7</text>
        <text class="tick" x="32" y="263" text-anchor="end">1</text>
        <text class="tick" x="32" y="143" text-anchor="end">4</text>
        <text class="tick" x="32" y="23"  text-anchor="end">7</text>
        <text class="axis" x="160" y="294" text-anchor="middle">回避 →</text>
        <text class="axis" x="12" y="140" text-anchor="middle" transform="rotate(-90 12 140)">焦虑 →</text>
        <g class="pin" id="pin" transform="translate(160 140)">
          <circle r="22" fill="url(#halo)"/>
          <rect x="-7" y="-7" width="14" height="14" rx="2" transform="rotate(45)" fill="url(#gemGrad)" stroke="#eee9ff" stroke-width=".8"/>
        </g>
      </svg>
    </div>

    <div class="dims">
      <div>
        <div class="dim-top"><b>焦虑</b><span id="anxVal">4.0 / 7</span></div>
        <div class="dim-note">害怕被抛弃、需要确认的程度</div>
        <div class="bar"><i id="anxMark" style="--c:var(--rose)"></i></div>
      </div>
      <div>
        <div class="dim-top"><b>回避</b><span id="avoVal">4.0 / 7</span></div>
        <div class="dim-note">抗拒依赖、想保持距离的程度</div>
        <div class="bar"><i id="avoMark" style="--c:var(--cyan)"></i></div>
      </div>
    </div>

    <div class="read" id="reading"></div>

    <div class="actions">
      <button class="ghost" id="edit" type="button">回去改答案</button>
      <button class="ghost" id="reset" type="button">重新测一次</button>
    </div>
  </section>

  <p class="foot">这是根据依恋研究里“焦虑”和“回避”两个维度自编的简易测试，用来自我观察，不是心理诊断。依恋风格会随关系和经历变化，这里显示的是现在的位置，不是终身判决。想要更正式的版本，可以搜索 ECR-R 亲密关系经历量表。</p>
</main>

<script>
(function(){
  var Q = [
    {t:"我常担心对方没有我在乎他那样在乎我。", d:"A"},
    {t:"我不太习惯向亲近的人展示脆弱。", d:"V"},
    {t:"对方回消息慢了，我会忍不住想是不是自己做错了什么。", d:"A"},
    {t:"当别人想和我更亲近时，我会想往后退一步。", d:"V"},
    {t:"我很少担心被喜欢的人抛弃。", d:"A", r:true},
    {t:"遇到难事时，我很自然地会去找亲近的人。", d:"V", r:true},
    {t:"我害怕一旦对方真正了解我，就会离开。", d:"A"},
    {t:"我更愿意自己扛，而不是依赖别人。", d:"V"},
    {t:"我需要反复确认对方还在意我。", d:"A"},
    {t:"和人分享内心深处的想法，对我来说是舒服的。", d:"V", r:true},
    {t:"当我在意的人注意力在别处时，我会明显不安。", d:"A"},
    {t:"别人太依赖我的时候，我会感到压力。", d:"V"},
    {t:"关系里吵了架，我相信它不会轻易让我们走散。", d:"A", r:true},
    {t:"关系越来越近时，我会莫名想找点距离。", d:"V"},
    {t:"我有时觉得自己的感情“太多了”，会把人吓跑。", d:"A"},
    {t:"我觉得依靠别人并不是一件危险的事。", d:"V", r:true}
  ];

  var TYPES = {
    secure: {
      name:"安全型",
      body:"你在关系里大体能放松：相信自己值得被在乎，也不太怕依靠别人。不安当然也会来，只是它来的时候不太会把你淹没，你通常能回到原处。",
      watch:"可以留意：安全不等于从不受伤。它更像受伤后比较容易修复。"
    },
    anxious: {
      name:"焦虑型",
      body:"你愿意靠近，也很需要靠近。不安常常来自“对方会不会走”，于是你会去确认、去抓紧。这股力量背后，是很强的联结渴望。",
      watch:"可以留意：想确认的冲动上来时，先分辨一下，是对方真的在远离，还是旧的害怕被触发了。"
    },
    avoidant: {
      name:"回避型",
      body:"你习惯把自己照顾好，不太让别人看见你需要什么。别人靠得太近时，你会本能地守住边界。独立是真的，有时它也是一层保护壳。",
      watch:"可以留意：想退的那一刻，问问自己是真的需要空间，还是在躲开可能的失望。"
    },
    fearful: {
      name:"恐惧-回避型",
      body:"你既渴望亲密，又害怕亲密。靠近了想逃，远了又难受，常常在两个方向之间被拉扯。这是最耗力气的一种位置，因为两股力都是真的。",
      watch:"可以留意：这种拉扯说明两种需要同时存在。先允许它们都在，再慢慢看哪一边在什么时候更大声。"
    }
  };

  var KEY = "attach-prism-v1";
  var answers = Q.map(function(){return null;});
  var idx = 0, locked = false;

  var $ = function(id){return document.getElementById(id);};
  var quiz=$("quiz"), result=$("result"), qtext=$("qtext"), scale=$("scale"),
      counter=$("counter"), fill=$("fill"), back=$("back");

  var SIZES=[26,22,18,14,18,22,26];
  var COLORS=["var(--cyan)","#9fd8ff","#b6bfff","var(--lilac)","#dfa3ef","#f4a0dc","var(--rose)"];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  SIZES.forEach(function(s,i){
    var b=document.createElement("button");
    b.type="button"; b.className="facet"; b.id="facet-"+(i+1);
    b.setAttribute("aria-label",(i+1)+" 分"+(i===0?"，完全不像我":i===6?"，非常像我":""));
    b.setAttribute("aria-pressed","false");
    b.style.setProperty("--s",s); b.style.setProperty("--c",COLORS[i]);
    b.innerHTML='<span class="gem"></span>';
    b.addEventListener("click",function(){choose(i+1);});
    scale.appendChild(b);
  });

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify({a:answers,i:idx})); }catch(e){} }
  function load(){
    try{
      var s=JSON.parse(localStorage.getItem(KEY)||"null");
      if(s && Array.isArray(s.a) && s.a.length===Q.length){
        answers=s.a; idx=Math.max(0,Math.min(s.i||0,Q.length-1));
      }
    }catch(e){}
  }

  function paintSelection(){
    var v=answers[idx];
    Array.prototype.forEach.call(scale.children,function(b,i){
      b.setAttribute("aria-pressed", String(v===i+1));
    });
  }

  function render(animate){
    var go=function(){
      qtext.textContent=Q[idx].t;
      counter.textContent="第 "+(idx+1)+" 题 / 共 "+Q.length+" 题";
      paintSelection();
      back.disabled = idx===0;
      qtext.classList.remove("swap");
    };
    var done=answers.filter(function(x){return x!=null;}).length;
    fill.style.width=(done/Q.length*100)+"%";
    if(animate && !reduce){ qtext.classList.add("swap"); setTimeout(go,180); } else go();
  }

  function choose(v){
    if(locked) return;
    answers[idx]=v; paintSelection(); save();
    var done=answers.filter(function(x){return x!=null;}).length;
    fill.style.width=(done/Q.length*100)+"%";
    locked=true;
    setTimeout(function(){
      locked=false;
      if(idx<Q.length-1){ idx++; save(); render(true); }
      else{
        var miss=answers.indexOf(null);
        if(miss===-1) showResult(true);
        else { idx=miss; save(); render(true); }
      }
    }, reduce?60:300);
  }

  back.addEventListener("click",function(){ if(idx>0){ idx--; save(); render(true);} });

  document.addEventListener("keydown",function(e){
    if(quiz.hidden) return;
    if(e.target && /input|textarea/i.test(e.target.tagName)) return;
    var n=parseInt(e.key,10);
    if(n>=1 && n<=7) choose(n);
    if(e.key==="ArrowLeft" && idx>0){ idx--; save(); render(true); }
  });

  function score(){
    var A=[],V=[];
    Q.forEach(function(q,i){
      var v=answers[i]; if(v==null) return;
      var s=q.r?8-v:v;
      (q.d==="A"?A:V).push(s);
    });
    var mean=function(a){return a.reduce(function(x,y){return x+y;},0)/a.length;};
    return {anx:mean(A), avo:mean(V)};
  }

  function classify(anx,avo){
    var hiA=anx>4, hiV=avo>4;
    if(hiA&&hiV) return "fearful";
    if(hiA) return "anxious";
    if(hiV) return "avoidant";
    return "secure";
  }

  function showResult(scroll){
    var s=score(), key=classify(s.anx,s.avo), T=TYPES[key];
    $("typeName").textContent=T.name;
    $("coords").textContent="焦虑 "+s.anx.toFixed(1)+" · 回避 "+s.avo.toFixed(1)+"　（1 至 7，4 为分界）";
    $("anxVal").textContent=s.anx.toFixed(1)+" / 7";
    $("avoVal").textContent=s.avo.toFixed(1)+" / 7";

    document.querySelectorAll(".map [data-q]").forEach(function(el){
      el.classList.toggle("on", el.getAttribute("data-q")===key);
    });

    var html='<p>'+T.body+'</p><p class="watch">'+T.watch+'</p>';
    if(Math.abs(s.anx-4)<0.6 || Math.abs(s.avo-4)<0.6){
      html+='<p class="edge-note">你有一个维度落在分界线附近，相邻象限的描述也值得一起读。依恋本来就是连续的光谱，格子只是为了方便说话。</p>';
    }
    $("reading").innerHTML=html;

    quiz.hidden=true; result.hidden=false;
    fill.style.width="100%";

    var x=40+(s.avo-1)/6*240, y=260-(s.anx-1)/6*240;
    var pin=$("pin"), am=$("anxMark"), vm=$("avoMark");
    var place=function(){
      pin.setAttribute("transform","translate("+x.toFixed(1)+" "+y.toFixed(1)+")");
      am.style.left=((s.anx-1)/6*100)+"%";
      vm.style.left=((s.avo-1)/6*100)+"%";
    };
    if(reduce) place(); else requestAnimationFrame(function(){requestAnimationFrame(place);});

    if(scroll) result.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  }

  $("edit").addEventListener("click",function(){
    result.hidden=true; quiz.hidden=false; idx=Q.length-1; save(); render(false);
    quiz.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  });
  $("reset").addEventListener("click",function(){
    answers=Q.map(function(){return null;}); idx=0; save();
    result.hidden=true; quiz.hidden=false; render(false);
    quiz.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  });

  load();
  render(false);
  if(answers.indexOf(null)===-1) showResult(false);
})();
</script>
</body>
</html>
